<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatworks — Private Messaging</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#06111f,#102b45);color:#102033;min-height:100vh}.shell{width:min(1100px,94%);margin:28px auto}.brand{color:#d6aa52;font-weight:900;letter-spacing:1px}.auth,.app{background:#fff;border-radius:18px;box-shadow:0 20px 70px #0006;overflow:hidden}.auth{max-width:430px;margin:7vh auto;padding:28px}.auth h1{margin:8px 0}.hint{color:#64748b;font-size:14px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1;padding:11px;border:1px solid #dbe3ec;background:#f5f7fa;border-radius:8px;font-weight:800}.tabs button.active{background:#d6aa52;border-color:#d6aa52}.form{display:grid;gap:10px}.form input,.form button,.composer textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #cbd5e1;font:inherit}.form button,.composer button{background:#d6aa52;border:0;font-weight:800;cursor:pointer}.note{font-size:12px;color:#64748b}.err{color:#b42318;background:#fff0ef;padding:9px;border-radius:8px}.app{display:grid;grid-template-columns:310px 1fr;min-height:680px}.side{border-right:1px solid #e5e7eb;background:#f8fafc}.sidehead{padding:18px;border-bottom:1px solid #e5e7eb}.sidehead b{display:block}.search{margin-top:12px;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px}.users{max-height:550px;overflow:auto}.user{padding:13px 16px;border-bottom:1px solid #e5e7eb;cursor:pointer}.user:hover,.user.active{background:#eef4f8}.user small{display:block;color:#64748b;margin-top:3px}.main{display:flex;flex-direction:column}.top{padding:18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}.top button{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:8px 11px}.messages{flex:1;padding:20px;overflow:auto;background:#fbfcfd}.bubble{max-width:72%;padding:10px 13px;border-radius:13px;margin:8px 0;line-height:1.4}.mine{margin-left:auto;background:#e6f4ea}.theirs{background:#eef2f7}.bubble small{display:block;color:#64748b;font-size:10px;margin-top:4px}.composer{padding:14px;border-top:1px solid #e5e7eb;display:flex;gap:8px}.composer textarea{resize:none;flex:1}.composer button{width:100px;border-radius:9px}.empty{height:100%;display:grid;place-items:center;color:#64748b;text-align:center;padding:30px}@media(max-width:720px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #e5e7eb}.users{max-height:190px}.main{min-height:520px}.composer{position:sticky;bottom:0}.bubble{max-width:88%}}
</style></head><body><div class="shell"><div class="brand">CHATWORKS</div><div id="auth" class="auth"><h1>Private Messaging</h1><p class="hint">Search registered users and chat one-to-one. Your messages are visible only to you and the person you are chatting with.</p><div class="tabs"><button id="loginTab" class="active">Login</button><button id="regTab">Create account</button></div><form id="loginForm" class="form"><input id="loginUser" placeholder="Username" autocomplete="username" required><input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" required><button>Login</button><div id="loginNote" class="note"></div></form><form id="regForm" class="form" style="display:none"><input id="regName" placeholder="Your name" required><input id="regUser" placeholder="Username" required><input id="regPass" type="password" placeholder="Password (8+ characters)" minlength="8" required><button>Create account</button><div id="regNote" class="note"></div></form></div><div id="app" class="app" style="display:none"><aside class="side"><div class="sidehead"><b id="meName"></b><small id="meUser"></small><input id="search" class="search" placeholder="Search users..."></div><div id="userList" class="users"></div></aside><main class="main"><div class="top"><div><b id="chatTitle">Select a user</b><small id="chatUser"></small></div><button id="logout">Logout</button></div><div id="messages" class="messages"><div class="empty">Search for a registered user and select them to start a private conversation.<div style="text-align:center;margin:12px 0"><a href="mailto:KRSS39@gamil.com">KRSS Email: KRSS39@gamil.com</a></div></div><form id="composer" class="composer" style="display:none"><textarea id="message" rows="2" placeholder="Write a private message..." maxlength="2000" required></textarea><button>Send</button></form></main></div></div><script>
let me=null,selected=null,timer=null;const $=id=>document.getElementById(id);function note(el,msg,err=false){el.textContent=msg;el.className=err?'note err':'note'}
$('loginTab').onclick=()=>{ $('loginTab').classList.add('active');$('regTab').classList.remove('active');$('loginForm').style.display='grid';$('regForm').style.display='none'};$('regTab').onclick=()=>{$('regTab').classList.add('active');$('loginTab').classList.remove('active');$('loginForm').style.display='none';$('regForm').style.display='grid'};
async function check(){const r=await fetch('/api/chatworks/me');const d=await r.json();if(d.authenticated){me=d.user;showApp();}}
$('loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/chatworks/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username:$('loginUser').value,password:$('loginPass').value})});const d=await r.json();if(!r.ok)return note($('loginNote'),d.error||'Login failed',true);me=d.user;showApp()};
$('regForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/chatworks/register',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({name:$('regName').value,username:$('regUser').value,password:$('regPass').value})});const d=await r.json();if(!r.ok)return note($('regNote'),d.error||'Registration failed',true);me=d.user;showApp()};
function showApp(){$('auth').style.display='none';$('app').style.display='grid';$('meName').textContent=me.name;$('meUser').textContent='@'+me.username;loadUsers('');}
async function loadUsers(q){const r=await fetch('/api/chatworks/users?q='+encodeURIComponent(q));if(!r.ok)return;const d=await r.json();$('userList').innerHTML=d.users.map(u=>`<div class="user ${selected&&selected.id===u.id?'active':''}" onclick='selectUser(${JSON.stringify(u)})'><b>${esc(u.name)}</b><small>@${esc(u.username)}</small></div>`).join('')||'<div class="empty">No users found.</div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.selectUser=u=>{selected=u;$('chatTitle').textContent=u.name;$('chatUser').textContent='@'+u.username;$('composer').style.display='flex';loadUsers($('search').value);loadMessages();clearInterval(timer);timer=setInterval(loadMessages,4000)};
async function loadMessages(){if(!selected)return;const r=await fetch('/api/chatworks/messages/'+selected.id);if(!r.ok)return;const d=await r.json();$('messages').innerHTML=d.messages.map(m=>`<div class="bubble ${m.from===me.id?'mine':'theirs'}">${esc(m.text)}<small>${m.from===me.id?'You':esc(selected.name)} · ${new Date(m.time).toLocaleString()}</small></div>`).join('')||'<div class="empty">No messages yet. Say hello.</div>';$('messages').scrollTop=$('messages').scrollHeight}
$('search').oninput=e=>loadUsers(e.target.value.trim());$('composer').onsubmit=async e=>{e.preventDefault();if(!selected)return;const text=$('message').value.trim();if(!text)return;const r=await fetch('/api/chatworks/messages',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({to:selected.id,text})});if(!r.ok){const d=await r.json();alert(d.error||'Send failed');return}$('message').value='';loadMessages()};$('logout').onclick=async()=>{await fetch('/api/chatworks/logout',{method:'POST'});location.reload()};check();
</script></body></html>
